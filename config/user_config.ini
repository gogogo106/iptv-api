[Settings]
; =========================
; 全局功能开关
; =========================

# 开启更新，用于控制是否更新接口，若关闭则所有工作模式（获取接口和测速）均停止；可选值: True, False
open_update = True

# 开启未匹配频道分类，source_file 中未匹配的频道会进入该分类并直接写入结果，不参与测速 
open_unmatch_category = False

# 开启无结果频道分类，自动归类至底部；可选值: True, False 
open_empty_category = False

# 开启显示更新时间；可选值: True, False
open_update_time = True

# 开启显示接口说明信息，用于控制是否显示接口来源、分辨率、协议类型等信息，为 $ 符号后的内容，播放软件使用该信息对接口进行描述，若部分播放器（如 PotPlayer）不支持解析导致无法播放可关闭；可选值: True, False
open_url_info = False

# 开启 EPG 功能，支持频道显示预告内容；可选值: True, False
open_epg = True

# 开启从订阅源 m3u 头部 url-tvg/x-tvg-url 自动提取 EPG 地址，并入 EPG 源一起合并，无需手动维护 `config/epg.txt`；已配置的 epg.txt 源优先，订阅源仅补充其未覆盖的频道；需配合 open_epg = True 使用；可选值: True, False
open_subscribe_epg = True

# 开启转换生成 m3u 文件类型结果链接，支持显示频道图标；可选值: True, False
open_m3u_result = True

# 单个频道接口数量
urls_limit = 10

# 更新时间显示位置，需要开启 open_update_time 才能生效；可选值: top、bottom；top: 显示于结果顶部，bottom: 显示于结果底部 
update_time_position = top

# 系统语言设置；可选值: zh_CN、en 
language = zh_CN


; =========================
; 定时执行设置
; =========================

# 定时执行更新时间模式，不作用于工作流；可选值: interval、time； interval: 按间隔时间执行，time: 按指定时间点执行
update_mode = interval

# 定时执行更新时间间隔，仅在update_mode = interval时生效，单位小时，设置 0 或空则只运行一次；默认值: 12
update_interval = 12

# 定时执行更新时间点，仅在update_mode = time时生效，格式 HH:MM，支持多个时间点逗号分隔 
update_times = 02:00

# 启动时执行更新，用于控制程序启动后是否立即执行一次更新；可选值: True, False
update_startup = True

# 时区，可用于控制定时执行时区或显示更新时间的时区；可选值: Asia/Shanghai 或其它时区编码
time_zone = Asia/Shanghai


; =========================
; 结果输出 & 服务配置
; =========================

# 模板文件路径；默认值: config/demo.txt
source_file = config/user_demo.txt

# 生成结果文件路径；默认值: output/result.txt
final_file = output/user_result.txt

# 开启实时写入结果文件，在测速过程中可以访问并使用更新结果
open_realtime_write = True

# 开启页面服务，用于控制是否启动结果页面服务；如果使用青龙等平台部署，有专门设定的定时任务，需要更新完成后停止运行，可以关闭该功能；可选值: True, False
open_service = False

# 页面服务端口，用于控制页面服务的端口号；默认值: 5180
app_port = 5180

# 公网协议；可选值: http、https
public_scheme = http

# 公网 Host 地址，用于生成结果中的访问地址，默认使用本机 IP
public_domain = 127.0.0.1

# CDN 代理加速地址，用于订阅源、频道图标等资源的加速访问；支持配置多个（用英文逗号分隔），订阅源与 EPG 会按顺序逐个回退拉取，任一镜像成功即停，频道图标等资源使用第一个地址
cdn_url = 

# HTTP 代理地址，用于获取订阅源等网络请求
http_proxy =


; =========================
; 数据源总开关
; =========================

# 开启本地源功能，将使用模板文件与本地源文件（local.txt）中的数据；可选值: True, False 
open_local = True

# 开启订阅源功能；可选值: True, False
open_subscribe = True

# 开启自动停用失效地址，当请求重试后失败、内容为空或没有匹配到符合条件的值时，会自动在 `config/subscribe.txt` 和 `config/epg.txt` 中对应地址前添加 # 进行停用；可选值: True, False
open_auto_disable_source = True


; =========================
; 数据源工作模式
; =========================

# 开启使用历史更新结果（包含模板与结果文件的接口），合并至本次更新中；可选值: True, False
open_history = True

# 开启使用 M3U 内含的请求头验证信息，用于测速等操作，个别播放器可能不支持播放这类含验证信息的接口；可选值: True, False
open_headers = True

# 全局请求 User-Agent，用于拉取订阅源、测速以及写入 m3u 结果（无需开启 open_headers），留空则使用内置默认 UA；优先级：接口自带 UA > 订阅地址 UA > 全局 UA > 内置默认 UA
user_agent = 


; =========================
; 过滤 & 测速设置
; =========================

# 开启测速功能，获取响应时间、速率、分辨率；可选值: True, False
open_speed_test = True

# 开启分辨率过滤，低于最小分辨率（min_resolution）的接口将会被过滤，GUI 用户需要手动安装 FFmpeg，程序会自动调用 FFmpeg 获取接口分辨率，推荐开启，虽然会增加测速阶段耗时，但能更有效地区分是否可播放的接口；可选值: True, False
open_filter_resolution = True

# 开启速率过滤，低于最小速率（min_speed）的接口将会被过滤；可选值: True, Fals
open_filter_speed = True

# 开启广告过滤，自动识别并过滤无信号/广告等循环占位源（含 #EXT-X-ENDLIST 的短循环列表，或片段地址包含广告关键字），复用测速阶段已抓取的播放列表进行判断，不增加额外请求与测速耗时；可选值: True, False
open_filter_ad = True

# 开启全量测速，频道下所有接口（白名单除外）都进行测速，关闭则当测速有效结果数量达到urls_limit后停止剩余接口测速
open_full_speed_test = True

# 开启补偿机制模式，用于控制当频道接口数量不足时，自动将不满足条件（例如低于最小速率）但可能可用的接口添加至结果中，从而避免结果为空的情况；开启后，不符合 location/isp 归属地或运营商的接口也不再直接丢弃，而是降权排到该频道结果的末尾作为补充；可选值: True, False
open_supply = True

# 结果排序维度，控制每个频道内接口的排序优先级，按从前到后的顺序依次比较，逗号分隔；可选值: speed（速率，高优先）、delay（延迟，低优先）、resolution（分辨率，高优先），例如: resolution,speed
sort_by = speed

# 接口最小分辨率，需要开启 open_filter_resolution 才能生效
min_resolution = 1280x720

# 接口最大分辨率，需要开启 open_filter_resolution 才能生效
max_resolution = 3840x2160

# 接口最小速率（单位 M/s），需要开启 open_filter_speed 才能生效
min_speed = 0.3

# 分辨率与速率映射关系，用于控制不同分辨率接口的最低速率要求，格式为 resolution:speed，多个映射关系逗号分隔 
resolution_speed_map = 1280x720:0.2,1920x1080:0.5,3840x2160:1.0

# 性能模式，auto 根据设备或容器的 CPU、内存自动选择，powersave 优先降低资源消耗，balance 平衡资源与速度，fast 充分利用高性能设备；可选值: auto、powersave、balance、fast
performance_mode = auto

# 测速并发高级覆盖值，0 表示由性能模式自动决定，大于 0 时仅覆盖测速网络并发 
speed_test_limit = 10

# 单个接口测速超时时长，单位秒(s)；数值越大测速所需时间越长，能提高获取接口数量，但质量会有所下降；数值越小测速所需时间越短，能获取低延时的接口，质量较好；调整此值能优化更新时间
speed_test_timeout = 10

# 测速阶段使用 Host 地址进行过滤，相同 Host 地址的频道将共用测速数据，开启后可大幅减少测速所需时间，但可能会导致测速结果不准确；可选值: True, False
speed_test_filter_host = True

# 查询请求超时时长，单位秒(s)，用于控制查询接口文本链接的超时时长以及重试时长，调整此值能优化更新时间
request_timeout = 10


; =========================
; 网络协议 & 地域偏好
; =========================

# 强制认为当前网络支持 IPv6，跳过检测
ipv6_support = False

# 生成结果中接口的协议类型；可选值: ipv4、ipv6、all
ipv_type = all

# 接口协议类型偏好，优先将该类型的接口排在结果前面；可选值: ipv4、ipv6、auto
ipv_type_prefer = auto

# 接口归属地，用于控制结果只包含填写的归属地类型，支持关键字过滤，英文逗号分隔，不填写表示不指定归属地，建议使用靠近使用者的归属地，能提升播放体验
location =

# 接口运营商，用于控制结果中只包含填写的运营商类型，支持关键字过滤，英文逗号分隔，不填写表示不指定运营商
isp =


; =========================
; 结果排序偏好
; =========================

# 结果偏好的接口来源，结果优先按该顺序进行排序，逗号分隔，例如: local,subscribe；不填写则表示不指定来源，按照接口速率排序
origin_type_prefer =


; =========================
; 本地源 / Local Source
; =========================

# 结果中偏好的本地源接口数量
local_num = 10


; =========================
; 订阅源
; =========================

# 结果中偏好的订阅源接口数量
subscribe_num = 10


; =========================
; 频道台标
; =========================

# 频道台标库地址
logo_url = https://www.xn--rgv465a.top/tvlogo

# 频道台标文件类型
logo_type = png

# 开启优先使用订阅源 m3u 中自带的 tvg-logo 台标地址，仅当订阅源未提供时才回退到台标库；可选值: True, False
open_subscribe_logo = True


; =========================
; RTMP 推流
; =========================

# 开启 RTMP 推流功能，需要安装 FFmpeg，利用本地带宽提升接口播放体验；可选值: True, False
open_rtmp = False

# Nginx HTTP 服务端口，用于 RTMP 推流转发的 HTTP 服务端口；默认值: 8080
nginx_http_port = 8080

# Nginx RTMP 服务端口，用于 RTMP 推流转发的 RTMP 服务端口；默认值: 1935
nginx_rtmp_port = 1935

# RTMP 频道接口空闲停止推流超时时长，单位秒(s)，用于控制接口无人观看时超过该时长后停止推流，调整此值能优化服务器资源占用
rtmp_idle_timeout = 300

# RTMP 推流最大并发数量，用于控制同时推流的频道数量，数值越大服务器压力越大，调整此值能优化服务器资源占用
rtmp_max_streams = 10

# 推流转码模式，copy 则不进行转码，以复制方式输出，可以最大程度节省CPU消耗，auto 则自适应匹配播放器进行转码，会增加CPU消耗但能提升兼容性；可选值: copy、auto 
rtmp_transcode_mode = copy